<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden – Hausmesse</title>
<style>
  :root {
    --bg: #0f1524; --panel: #161d2e; --line: #34405a; --text: #c9d2e3; --dim: #7d89a3;
    --lamp: #f5c46a; --heat: #ef6b4f;
    --sans: system-ui, "Segoe UI", "DejaVu Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans);
    display: grid; place-items: center; padding: 20px;
  }
  main { width: 100%; max-width: 340px; }

  .house { display: block; width: 96px; height: auto; margin: 0 0 22px; }
  .house .outline { fill: none; stroke: var(--line); stroke-width: 3; stroke-linejoin: round; }
  .house .pane { fill: #1f283b; transition: fill .6s ease, filter .6s ease; }
  .house.lit .pane { fill: var(--lamp); filter: drop-shadow(0 0 6px rgba(245, 196, 106, .7)); }
  @media (prefers-reduced-motion: reduce) { .house .pane { transition: none; } }

  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.lead { color: var(--dim); margin: 0 0 24px; }

  label { display: block; font-size: 14px; margin: 0 0 6px; }
  input {
    width: 100%; padding: 11px 12px; margin: 0 0 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  button {
    width: 100%; padding: 11px 14px; margin-top: 4px; border-radius: 10px; cursor: pointer;
    font: 600 15px var(--sans); background: var(--lamp); color: #1b1608; border: 1px solid var(--lamp);
  }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--heat); min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
</style>
</head>
<body>
<main>
  <svg class="house" id="house" viewBox="0 0 96 80" aria-hidden="true">
    <path class="outline" d="M8 38 L48 6 L88 38 M18 30 V74 H78 V30"/>
    <rect class="pane" x="38" y="42" width="20" height="18" rx="2"/>
  </svg>
  <h1>Hausmesse</h1>
  <p class="lead">Melde dich an, um das Haus zu steuern.</p>

  <form id="form" novalidate>
    <label for="user">Benutzername</label>
    <input id="user" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="pw">Passwort</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Anmelden</button>
    <p class="error" id="error" role="alert"></p>
  </form>
</main>
<script>
  const form = document.getElementById("form");
  const btn = document.getElementById("btn");
  const error = document.getElementById("error");
  const user = document.getElementById("user");
  const pw = document.getElementById("pw");
  user.focus();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.textContent = "";
    btn.disabled = true;
    btn.textContent = "Prüfe …";
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: user.value, passwort: pw.value }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Anmeldung fehlgeschlagen.");
      document.getElementById("house").classList.add("lit");   // Licht geht an
      setTimeout(() => location.href = "/", matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 500);
    } catch (err) {
      error.textContent = err.message === "Failed to fetch"
        ? "Der Pi ist nicht erreichbar." : err.message;
      pw.value = "";
      pw.focus();
      btn.disabled = false;
      btn.textContent = "Anmelden";
    }
  });
</script>
</body>
</html>
